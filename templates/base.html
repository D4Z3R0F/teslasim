<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TeslaSim{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header role="banner">
        <nav aria-label="Главное меню">
            <a href="{{ url_for('pages.index') }}" class="logo">⚡ TeslaSim</a>
            <a href="{{ url_for('pages.dashboard') }}">Мои Roadster</a>
            <a href="{{ url_for('pages.login_page') }}">Вход</a>
        </nav>
    </header>
    <main role="main">
        <div id="notifications" class="notifications" aria-live="polite"></div>
        {% block content %}{% endblock %}
    </main>
    <footer role="contentinfo">
        <p>TeslaSim — интерактивная симуляция Roadster</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
