{% extends "base.html" %}
{% block title %}Вход — TeslaSim{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Вход в систему</h2>
    {% if error %}<p style="color:var(--accent); margin-bottom:1rem;">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ url_for('pages.login_page') }}">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
    </form>
    <p style="margin-top:1rem; text-align:center;">Нет аккаунта? <a href="{{ url_for('pages.register_page') }}" style="color:var(--accent);">Регистрация</a></p>
</div>
{% endblock %}
