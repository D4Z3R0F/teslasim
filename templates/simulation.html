{% extends "base.html" %}
{% block title %}3D Симуляция — TeslaSim{% endblock %}

{% block content %}
<!-- Подключаем Three.js и загрузчик моделей -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<div class="dashboard" style="display: flex; flex-direction: column; gap: 1rem;">
    
    <!-- 3D ОКНО -->
    <div id="3d-container" style="width: 100%; height: 500px; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); border-radius: 12px; border: 1px solid #333; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 10px; left: 20px; color: rgba(255,255,255,0.7); font-family: monospace; z-index: 10;">
            <div id="speed-ui" style="font-size: 3rem; font-weight: bold; color: var(--accent);">0 <span style="font-size:1rem; color:#888;">км/ч</span></div>
            <div style="font-size: 0.8rem; margin-top: 5px;">ЛКМ + мышь: вращать камеру</div>
            <div style="font-size: 0.8rem;">Колесико: приблизить</div>
        </div>
    </div>

    <!-- ПАНЕЛЬ ТЕЛЕМЕТРИИ -->
    <div class="telemetry" style="display: flex; gap: 1rem;">
        <div class="metric">
            <span class="label">🔋 Батарея</span>
            <span class="value"><span id="battery">100</span>%</span>
            <div class="bar"><div id="battery-bar" class="fill" style="width: 100%;"></div></div>
        </div>
        <div class="metric">
            <span class="label">📏 Запас хода</span>
            <span class="value"><span id="range">1000</span> км</span>
        </div>
        <div class="metric">
            <span class="label">🛣️ Пробег</span>
            <span class="value"><span id="odometer">0</span> км</span>
        </div>
    </div>

    <!-- КНОПКИ УПРАВЛЕНИЯ -->
    <div class="controls">
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <button id="btn-start" class="btn btn-primary" style="flex:1;">▶ Запустить</button>
            <button id="btn-stop" class="btn btn-danger" style="flex:1;">■ Стоп</button>
        </div>

        <div class="pedals" style="display: flex; gap: 1rem;">
            <button id="btn-gas" class="btn pedal-gas" style="flex:1; background:#2ecc71; color:#000; font-weight:bold; padding: 2rem;">ГАЗ</button>
            <button id="btn-brake" class="btn pedal-brake" style="flex:1; background:var(--accent); color:#fff; font-weight:bold; padding: 2rem;">ТОРМОЗ</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ==========================================
// 1. ЛОГИКА УПРАВЛЕНИЯ (СЕТЬ И КНОПКИ)
// ==========================================
const SIM_ID = {{ sim.id }};
let running = false;
let throttle = 0;
let brake = 0;
let currentSpeed = 0;

const gasBtn = document.getElementById('btn-gas');
const brakeBtn = document.getElementById('btn-brake');

['mousedown', 'touchstart'].forEach(ev => gasBtn.addEventListener(ev, e => { e.preventDefault(); throttle = 1; }));
['mouseup', 'mouseleave', 'touchend'].forEach(ev => gasBtn.addEventListener(ev, () => throttle = 0));

['mousedown', 'touchstart'].forEach(ev => brakeBtn.addEventListener(ev, e => { e.preventDefault(); brake = 1; }));
['mouseup', 'mouseleave', 'touchend'].forEach(ev => brakeBtn.addEventListener(ev, () => brake = 0));

document.getElementById('btn-start').onclick = async () => {
    const r = await fetch(`/api/simulations/${SIM_ID}/start`, { method: 'POST' });
    if (r.ok) { running = true; showNotification('Поехали!', 'success'); }
};
document.getElementById('btn-stop').onclick = async () => {
    await fetch(`/api/simulations/${SIM_ID}/stop`, { method: 'POST' });
    running = false;
    currentSpeed = 0;
    showNotification('Симуляция остановлена', 'info');
};
// Цикл общения с сервером (10 раз в секунду)
setInterval(async () => {
    if (!running) return;
    try {
        const r = await fetch(`/api/simulations/${SIM_ID}/tick`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ throttle, brake })
        });
        if (!r.ok) return;
        const data = await r.json();
        
        currentSpeed = data.speed_kmh; 
        updateUI(data);
    } catch (e) { }
}, 100);

function updateUI(d) {
    document.getElementById('speed-ui').innerHTML = `${d.speed_kmh} <span style="font-size:1rem; color:#888;">км/ч</span>`;
    document.getElementById('battery').textContent = d.battery_percent;
    document.getElementById('battery-bar').style.width = d.battery_percent + '%';
    document.getElementById('battery-bar').style.background = d.battery_percent < 20 ? '#e74c3c' : '#2ecc71';
    document.getElementById('range').textContent = d.range_km;
    document.getElementById('odometer').textContent = d.odometer_km;
}

// ==========================================
// 2. 3D ДВИЖОК (THREE.JS)
// ==========================================
const container = document.getElementById('3d-container');
const scene = new THREE.Scene();

// Камера
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(5, 3, 8);

// Рендерер
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Управление камерой мышкой (вращение)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.05; // Не даем опустить камеру под землю

// Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Пол (дорога)
const floorGeo = new THREE.PlaneGeometry(200, 200);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Сетка на полу (чтобы было видно движение)
const gridHelper = new THREE.GridHelper(200, 100, 0x444444, 0x222222);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// --- МАШИНА ---
let car = new THREE.Group();
let mixer = null;

// Попытка загрузить 3D модель (если файла нет, сработает fallback)
const loader = new THREE.GLTFLoader();
loader.load('/static/tesla.glb', function (gltf) {
    // Если файл найден
    car = gltf.scene;
    car.traverse((node) => {
        if (node.isMesh) node.castShadow = true;
    });

    car.rotation.y = Math.PI;
    
    // Масштабируем (зависит от исходной модели)
    car.scale.set(1, 1, 1); 
    car.position.y = 0;
    scene.add(car);
}, undefined, function (error) {
    // Если файла нет, рисуем красивый красный суперкар из кубов
    console.log("Модель не найдена, используем заглушку.");
    
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe31937, metalness: 0.8, roughness: 0.2 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4.5), bodyMat);
    body.position.y = 0.5;
    body.castShadow = true;
    
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 2), cabinMat);
    cabin.position.set(0, 0.95, -0.2);
    cabin.castShadow = true;

    // Колеса
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const wheels = [];
    const wheelPositions = [[-1, 0.4, 1.5], [1, 0.4, 1.5], [-1, 0.4, -1.5], [1, 0.4, -1.5]];
    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(...pos);
        wheel.castShadow = true;
        car.add(wheel);
        wheels.push(wheel);
    });

    car.add(body);
    car.add(cabin);
    scene.add(car);
});

// Анимация 3D
let carOffset = 0;
const clock = new THREE.Clock();

function animate3D() {
    requestAnimationFrame(animate3D);

    // Если машина едет, двигаем сетку на полу (эффект движения)
    if (currentSpeed > 0) {
        gridHelper.position.z += currentSpeed * 0.05;
        // Сбрасываем позицию для бесконечной дороги
        if (gridHelper.position.z > 10) gridHelper.position.z = 0;
        
        // Легкая тряска машины от скорости
        car.position.y = Math.sin(Date.now() * 0.01) * 0.02 * (currentSpeed / 100);
    } else {
        car.position.y = 0;
    }

    controls.update();
    renderer.render(scene, camera);
}

// Запускаем 3D
animate3D();

// Обработка изменения размера окна
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
{% endblock %}
